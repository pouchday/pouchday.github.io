  <body>
    <header x-data="headerNav()" x-init="init()" @click.outside="closeAll()">
  <a href="/" class="logo">
    <img src="/assets/logo-mxTr47OJ.svg" alt="PouchDay Logo" />
  </a>

  <button
    class="nav-toggle"
    type="button"
    aria-label="Toggle navigation"
    @click="toggleNav()"
    :aria-expanded="navOpen"
  >
    <span></span><span></span><span></span>
  </button>

  <nav>
    <a href="/">Home</a>
    <a href="/ship/">Ship</a>
    <div class="nav-group">
      <button
        class="nav-group-btn"
        type="button"
        aria-expanded="false"
        aria-controls="travel-menu"
        @click.stop="toggleTravelMenu()"
        :aria-expanded="travelMenuOpen"
      >
        Travel
        <svg
          class="nav-chevron"
          viewBox="0 0 10 6"
          width="10"
          height="6"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M1 1l4 4 4-4"></path>
        </svg>
      </button>
      <div
        id="travel-menu"
        class="nav-group-menu"
        :class="{ 'is-open': travelMenuOpen }"
      >
        <a href="/travel/seeking/" @click="closeAll()">Seeking Travelers</a>
        <a href="/travel/offer/" @click="closeAll()">Offer to Travel</a>
      </div>
    </div>
    <a href="/donate/" @click="closeAll()">Donate</a>
    <a href="/contact/" @click="closeAll()">Contact</a>
  </nav>
</header>

    <main>
      <div class="contact-intro">
        <h1>Contact Us</h1>
        <p>Have a question? Send us a message and we'll reply by email.</p>
      </div>

      <div class="success-message" id="contact-success" hidden>
        <div class="success-icon">✓</div>
        <h2>Message sent!</h2>
        <p>Thanks for reaching out. We'll get back to you within 24 hours.</p>
      </div>

      <form
        action="https://formsubmit.co/pouchday-dev@proton.me"
        method="POST"
        id="contact-form"
      >
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_subject" value="New Contact Message" />
        <input
          type="hidden"
          name="_next"
          id="contact-next"
          value="/contact/?sent=1"
        />

        <div class="form-group">
          <label>Your Name</label>
          <input type="text" name="name" required />
        </div>

        <div class="form-group">
          <label>Your Email</label>
          <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label>Subject</label>
          <input type="text" name="subject" required />
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn-primary">Send Message</button>
      </form>
    </main>
    <footer>
  <div>&copy; 2024 PouchDay. Made with ❤️ for missionaries worldwide.</div>
  <div class="social-links" id="socials-footer">
    <a
      href="https://instagram.com/pouchday"
      class="social-link"
      target="_blank"
      rel="noopener"
    >
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5a4.25 4.25 0 0 0 4.25 4.25h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5a4.25 4.25 0 0 0-4.25-4.25h-8.5zm8 2.75a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7.25a4.75 4.75 0 1 1 0 9.5 4.75 4.75 0 0 1 0-9.5zm0 1.5a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5z"
        />
      </svg>
      Instagram
    </a>
    <a
      href="https://facebook.com/pouchday"
      class="social-link"
      target="_blank"
      rel="noopener"
    >
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.99 3.66 9.13 8.44 9.88v-6.99H7.9V12h2.54V9.8c0-2.51 1.49-3.9 3.78-3.9 1.09 0 2.24.19 2.24.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.45 2.89h-2.33v6.99C18.34 21.13 22 16.99 22 12z"
        />
      </svg>
      Facebook
    </a>
  </div>
</footer>

</html>
