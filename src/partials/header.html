<header x-data="headerNav()" x-init="init()" @click.outside="closeAll()">
  <a href="/" class="logo">
    <img src="/assets/images/logo.svg" alt="PouchDay Logo" />
  </a>

  <button
    class="nav-toggle"
    type="button"
    aria-label="Toggle navigation"
    @click="toggleNav()"
    :aria-expanded="navOpen"
  >
    <span></span><span></span><span></span>
  </button>

  <nav>
    <a href="/">Home</a>
    <a href="/ship/">Ship</a>
    <div class="nav-group">
      <button
        class="nav-group-btn"
        type="button"
        aria-expanded="false"
        aria-controls="travel-menu"
        @click.stop="toggleTravelMenu()"
        :aria-expanded="travelMenuOpen"
      >
        Travel
        <svg
          class="nav-chevron"
          viewBox="0 0 10 6"
          width="10"
          height="6"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M1 1l4 4 4-4"></path>
        </svg>
      </button>
      <div
        id="travel-menu"
        class="nav-group-menu"
        :class="{ 'is-open': travelMenuOpen }"
      >
        <a href="/travel/seeking/" @click="closeAll()">Seeking Travelers</a>
        <a href="/travel/offer/" @click="closeAll()">Offer to Travel</a>
      </div>
    </div>
    <a href="/donate/" @click="closeAll()">Donate</a>
    <a href="/contact/" @click="closeAll()">Contact</a>
  </nav>
</header>
