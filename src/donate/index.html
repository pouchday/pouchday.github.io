<!doctype html>
<html lang="en">
  <head>
    <load src="../partials/head.html" />
    <title>Donate | PouchDay</title>
    <script type="module" defer>
      import Alpine from "alpinejs";
      import { headerNav } from "../partials/header.js";

      Alpine.plugin(headerNav);

      window.Alpine = Alpine;
      Alpine.start();
    </script>
  </head>
  <body>
    <load src="../partials/header.html" />
    <main>
      <div class="donate-intro">
        <h1>Support the Mission</h1>
        <p>Every $35 covers the cost of one checked bag for a missionary.</p>
      </div>

      <form
        action="https://formsubmit.co/pouchday-dev@proton.me"
        method="POST"
        id="donate-form"
      >
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_subject" value="New Donation Pledge" />
        <input
          type="hidden"
          name="_next"
          id="donate-next"
          value="/#socials-footer"
        />

        <h3>Pledge Donation</h3>

        <div class="form-group">
          <label>Amount ($)</label>
          <input
            type="number"
            name="amount"
            value="35"
            inputmode="numeric"
            required
          />
        </div>

        <div class="form-group">
          <label>Frequency</label>
          <select name="frequency">
            <option value="One Time">One Time</option>
            <option value="Monthly">Monthly Subscription</option>
          </select>
        </div>

        <div class="form-group">
          <label>Your Email</label>
          <input
            type="email"
            name="donor_email"
            placeholder="We will email you payment details"
            required
          />
        </div>

        <button type="submit" class="btn-primary">Send Pledge</button>

        <div class="donate-note">
          <p>
            <strong>Note:</strong> Payment processing will be available soon.
            We'll email you when it's ready!
          </p>
        </div>
      </form>
    </main>
    <load src="../partials/footer.html" />
  </body>
</html>

<style>
  .donate-intro {
    text-align: center;
    margin-bottom: 3rem;
  }

  .donate-intro h1 {
    color: var(--c-navy);
    margin-bottom: 1rem;
  }

  .donate-intro p {
    font-size: 1.1rem;
    color: var(--c-muted);
  }

  .donate-note {
    margin-top: 2rem;
    padding: 1rem;
    background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    text-align: center;
  }

  .donate-note p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--c-navy);
  }
</style>

<script type="module" defer>
  const donateNext = document.getElementById("donate-next");

  if (donateNext) {
    donateNext.value = `${window.location.origin}/#socials-footer`;
  }
</script>
