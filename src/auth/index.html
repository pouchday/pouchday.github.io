<!doctype html>
<html lang="en">
  <head>
    <load src="../partials/head.html" />
    <title>Account Access | PouchDay</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      /* Component-specific overrides for centering the single card layout */
      .auth-container {
        max-width: 460px;
        margin: 2rem auto;
      }
      .oauth-divider {
        display: flex;
        align-items: center;
        text-align: center;
        color: var(--c-muted);
        font-size: 0.85rem;
        margin: 1.5rem 0;
      }
      .oauth-divider::before,
      .oauth-divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid var(--c-border);
      }
      .oauth-divider:not(:empty)::before {
        margin-right: 0.75em;
      }
      .oauth-divider:not(:empty)::after {
        margin-left: 0.75em;
      }

      .btn-oauth {
        width: 100%;
        border: 2px solid var(--c-border);
        background: var(--c-surface);
        color: var(--c-navy);
        border-radius: 12px;
        min-height: 48px;
        padding: 0.8rem 1rem;
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        transition: all 0.2s ease;
      }
      .btn-oauth:hover {
        background: var(--c-bg);
        border-color: var(--c-cyan);
      }
      .auth-toggle-hint {
        text-align: center;
        margin-top: 1.25rem;
        font-size: 0.9rem;
      }
      .auth-toggle-hint span {
        color: var(--c-cyan);
        font-weight: 700;
        cursor: pointer;
      }
    </style>
    <script type="module">
      import Alpine from "alpinejs";
      import { headerNav } from "../partials/header.js";

      Alpine.data("authHandler", () => ({
        isLogin: true,
        email: "",
        password: "",
        isSubmitting: false,

        async submitAuth() {
          this.isSubmitting = true;
          const action = this.isLogin ? "login" : "signup";

          try {
            const res = await fetch("/functions/api/auth", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action,
                email: this.email,
                password: this.password,
              }),
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Authentication failed");

            if (action === "login") {
              // Commit safe session user details to storage
              localStorage.setItem(
                "pouchday_session",
                JSON.stringify({
                  user: data.user,
                  access_token: data.session?.access_token,
                  expires_at: data.session
                    ? Date.now() + data.session.expires_in * 1000
                    : null,
                }),
              );
              window.location.href = "/ship/";
            } else {
              alert(
                "Registration complete! Please check your email for a verification link.",
              );
            }
          } catch (err) {
            alert(err.message);
          } finally {
            this.isSubmitting = false;
          }
        },

        async triggerOAuth(provider) {
          try {
            const res = await fetch("/functions/api/auth", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "oauth", provider }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            if (data.url) window.location.href = data.url;
          } catch (err) {
            alert(err.message);
          }
        },
      }));

      Alpine.plugin(headerNav);

      window.Alpine = Alpine;
      Alpine.start();
    </script>
  </head>
  <body>
    <load src="../partials/header.html" />
    <main>
      <div class="auth-container" x-data="authHandler">
        <h1 x-text="isLogin ? 'Welcome Back' : 'Create Account'"></h1>
        <p
          x-text="isLogin ? 'Sign in to manage your shipments.' : 'Register to start shipping to your missionary.'"
        ></p>

        <form @submit.prevent="submitAuth">
          <button
            type="button"
            class="btn-oauth"
            @click="triggerOAuth('google')"
          >
            <i class="fa-brands fa-google"></i> Continue with Google
          </button>
          <button
            type="button"
            class="btn-oauth"
            @click="triggerOAuth('apple')"
          >
            <i class="fa-brands fa-apple"></i> Continue with Apple
          </button>

          <div class="oauth-divider">or use credentials</div>

          <div class="form-group">
            <label for="auth-email">Email Address</label>
            <input
              id="auth-email"
              type="email"
              x-model="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="auth-password">Password</label>
            <input
              id="auth-password"
              type="password"
              x-model="password"
              placeholder="••••••••"
              required
            />
          </div>

          <button
            type="submit"
            :disabled="isSubmitting"
            x-text="isSubmitting ? 'Processing...' : (isLogin ? 'Sign In' : 'Sign Up')"
          ></button>

          <p class="auth-toggle-hint">
            <span x-show="isLogin"
              >Don't have an account?
              <span @click="isLogin = false">Create one</span></span
            >
            <span x-show="!isLogin"
              >Already have an account?
              <span @click="isLogin = true">Sign in</span></span
            >
          </p>
        </form>
      </div>
    </main>
    <load src="../partials/footer.html" />
  </body>
</html>
