<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | PouchDay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/shop-success.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="/assets/images/logo.svg" alt="PouchDay Logo">
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <nav>
            <a href="/">Home</a>
            <a href="/shop/">Shop</a>
            <a href="/travel/">Travel</a>
            <a href="/donate/">Donate</a>
            <a href="/contact/">Contact</a>
        </nav>
    </header>

    <main class="shop-success-main">

        <div class="shop-success-check">✓</div>

        <h1>Submission Received!</h1>
        <p>Your manifest has been sent to our logistics team.</p>

        <div class="card shop-success-details">
            <p><strong>Order ID:</strong> <span id="display-id">Loading...</span></p>
            <p><strong>Destination:</strong> <span id="display-dest">Loading...</span></p>
            <p><strong>Weight:</strong> <span id="display-weight">Loading...</span></p>
        </div>

        <button onclick="downloadPDF()" class="btn-primary shop-success-download">
            Download Packing Slip (PDF)
        </button>

        <p class="shop-success-note">
            Please print this slip and tape it to your box.
        </p>

    </main>

    <footer id="socials-footer">
        <p>Follow us for updates</p>
        <div class="social-links" aria-label="Social media links">
            <a class="social-link" href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle cx="17.5" cy="6.5" r="1"></circle>
                </svg>
                <span>Instagram</span>
            </a>
            <a class="social-link" href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 8h3V3h-3c-3 0-5 2-5 5v3H6v5h3v5h5v-5h3l1-5h-4V8c0-.7.3-1 1-1z"></path>
                </svg>
                <span>Facebook</span>
            </a>
        </div>
    </footer>

    <script>
        // 2. Parse URL Parameters
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id') || 'UNKNOWN';
        const dest = params.get('dest') || 'Unknown';
        const weight = params.get('weight') || '0';

        // Display on screen
        document.getElementById('display-id').textContent = orderId;
        document.getElementById('display-dest').textContent = dest;
        document.getElementById('display-weight').textContent = weight + ' lbs';

        // 3. PDF Generation Function
        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // -- Design the PDF --
            doc.setFontSize(22);
            doc.setTextColor(0, 48, 135); // Pan Am Blue
            doc.text("Logistics Co - Packing Slip", 20, 20);

            doc.setLineWidth(0.5);
            doc.line(20, 25, 190, 25);

            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);

            doc.text(`Order UUID: ${orderId}`, 20, 40);
            doc.text(`Destination: ${dest}`, 20, 50);
            doc.text(`Box Weight: ${weight} lbs`, 20, 60);
            doc.text(`Date: ${new Date().toLocaleDateString()}`, 20, 70);

            // Add a box for "Warehouse Use Only"
            doc.setDrawColor(0);
            doc.rect(20, 90, 170, 40);
            doc.text("Warehouse Use Only:", 25, 100);
            doc.text("[ ] Verified Weight", 25, 115);
            doc.text("[ ] Security Check", 100, 115);

            // Save
            doc.save(`Packing_Slip_${orderId}.pdf`);
        }
    </script>
</body>

</html>
