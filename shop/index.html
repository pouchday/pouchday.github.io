<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | PouchDay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/shop.css">
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="/assets/images/logo.svg" alt="PouchDay Logo">
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <a href="/">Home</a>
            <a href="/shop/">Shop</a>
            <a href="/travel/">Travel</a>
            <a href="/donate/">Donate</a>
            <a href="/contact/">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Submit Items</h1>
        <p>Fill out the manifest below. We accept .jpg and .png files.</p>

        <form id="shop-form" enctype="multipart/form-data">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="New Shipping Manifest">
            <input type="hidden" name="_next" id="next_redirect">

            <input type="hidden" name="order_uuid" id="order_uuid">

            <div class="form-group">
                <label>Missionary Photo</label>
                <input type="file" name="missionary_photo" accept="image/*" required>
            </div>

            <div id="items-container">
                <div class="form-group">
                    <label>Item 1 Photo</label>
                    <input type="file" name="item_photo_1" accept="image/*" required>
                </div>
            </div>

            <div class="form-group">
                <button type="button" class="btn-add-item" onclick="addItemField()">
                    + Add Another Item
                </button>
            </div>

            <div class="form-group">
                <label>Weight (lbs)</label>
                <input type="number" name="weight" inputmode="numeric" placeholder="e.g. 25" required id="field-weight">
            </div>

            <div class="form-group">
                <label>Mission Destination</label>
                <select name="mission" required id="field-mission">
                    <option value="" disabled selected>Loading missions...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your Email</label>
                <input type="email" name="customer_email" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="btn-primary">Generate & Submit</button>
        </form>
    </main>

    <footer id="socials-footer">
        <p>Follow us for updates</p>
        <div class="social-links" aria-label="Social media links">
            <a class="social-link" href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle cx="17.5" cy="6.5" r="1"></circle>
                </svg>
                <span>Instagram</span>
            </a>
            <a class="social-link" href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 8h3V3h-3c-3 0-5 2-5 5v3H6v5h3v5h5v-5h3l1-5h-4V8c0-.7.3-1 1-1z"></path>
                </svg>
                <span>Facebook</span>
            </a>
        </div>
    </footer>

    <script src="/assets/js/main.js"></script>
    <script>
        let itemCount = 1;
        function addItemField() {
            itemCount++;
            const container = document.getElementById('items-container');
            const div = document.createElement('div');
            div.className = 'form-group item-row';
            div.innerHTML = `
                <label>Item ${itemCount} Photo</label>
                <div class="item-input-row">
                    <input type="file" name="item_photo_${itemCount}" accept="image/*">
                    <button type="button" class="btn-delete-item" aria-label="Remove item ${itemCount}" onclick="this.closest('.item-row').remove()">Remove</button>
                </div>
            `;
            container.appendChild(div);
        }

        const form = document.getElementById('shop-form');
        const missionSelect = document.getElementById('field-mission');

        fetch('/assets/data/missions.json')
            .then(res => res.json())
            .then(missions => {
                const missionEntries = Object.entries(missions || {});

                if (!missionEntries.length) {
                    missionSelect.innerHTML = '<option value="" disabled selected>No missions available</option>';
                    return;
                }

                missionSelect.innerHTML = '';

                missionEntries.forEach(([missionName, isAvailable]) => {
                    const option = document.createElement('option');
                    option.value = missionName;
                    option.textContent = isAvailable ? missionName : `${missionName} (Unavailable)`;
                    option.disabled = !isAvailable;
                    missionSelect.appendChild(option);
                });

                const firstAvailable = missionEntries.find(([, isAvailable]) => isAvailable);
                if (firstAvailable) {
                    missionSelect.value = firstAvailable[0];
                }
            })
            .catch(() => {
                missionSelect.innerHTML = '<option value="" disabled selected>Unable to load missions</option>';
            });

        function generateUuid() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }

            if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
                const bytes = new Uint8Array(16);
                window.crypto.getRandomValues(bytes);
                bytes[6] = (bytes[6] & 0x0f) | 0x40;
                bytes[8] = (bytes[8] & 0x3f) | 0x80;
                const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
                return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
            }

            return `${Date.now()}-${Math.random().toString(16).slice(2, 10)}`;
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.textContent = "Processing...";
            submitBtn.disabled = true;

            // --- NEW LOGIC STARTS HERE ---

            // 1. Generate UUID (Short 8-char version is usually enough for packing slips, but here is full)
            const uuid = generateUuid();

            // 2. Set the Hidden Field (So it goes to Email)
            document.getElementById('order_uuid').value = uuid;

            // 3. Construct the Success URL with Params
            // Note: window.location.origin handles localhost vs production automatically
            const weightVal = document.getElementById('field-weight').value;
            const destVal = document.getElementById('field-mission').value;

            // Encode components to ensure URL is valid
            const successUrl = `${window.location.origin}/shop/success?id=${uuid}&weight=${weightVal}&dest=${encodeURIComponent(destVal)}`;

            document.getElementById('next_redirect').value = successUrl;

            // --- EXISTING FILE RENAMING LOGIC ---

            const formData = new FormData(form);
            const uniqueId = Date.now();

            // Rename files logic (Keep this from previous step)
            Array.from(formData.keys()).forEach((key) => {
                const file = formData.get(key);
                if (file instanceof File && file.name) {
                    const extension = file.name.split('.').pop() || 'jpg';
                    const newName = `${key}_${uniqueId}.${extension}`;
                    const renamedFile = new File([file], newName, { type: file.type });
                    formData.set(key, renamedFile);
                }
            });

            // 4. Send to FormSubmit
            fetch("https://formsubmit.co/pouchday-dev@proton.me", {
                method: "POST",
                body: formData
            })
                .then(response => {
                    // FormSubmit might redirect automatically if _next is set, 
                    // but since we are using fetch, we usually need to handle the redirect manually.
                    // However, setting _next in FormData tells FormSubmit where to go IF we were using a standard submit.
                    // With fetch, we just redirect manually:

                    window.location.href = successUrl;
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Upload failed.");
                    submitBtn.textContent = "Try Again";
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>

</html>
