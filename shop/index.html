<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | PouchDay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="/assets/images/logo.svg" alt="PouchDay Logo">
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <a href="/">Home</a>
            <a href="/shop/">Shop</a>
            <a href="/travel/">Travel</a>
            <a href="/donate/">Donate</a>
        </nav>
    </header>

    <main>
        <h1>Submit Items</h1>
        <p>Fill out the manifest below. We accept .jpg and .png files.</p>

        <form id="shop-form" enctype="multipart/form-data">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="New Shipping Manifest">

            <input type="hidden" name="order_uuid" id="order_uuid">
            <input type="hidden" name="_next" id="next_redirect">

            <div class="form-group">
                <label>Missionary Photo</label>
                <input type="file" name="missionary_photo" accept="image/*" required>
            </div>

            <div id="items-container">
                <div class="form-group">
                    <label>Item 1 Photo</label>
                    <input type="file" name="item_photo_1" accept="image/*" required>
                </div>
            </div>

            <div class="form-group">
                <button type="button" onclick="addItemField()"
                    style="background: transparent; color: var(--c-primary); border: 2px solid var(--c-primary); padding: 10px;">
                    + Add Another Item
                </button>
            </div>

            <div class="form-group">
                <label>Weight (lbs)</label>
                <input type="number" name="weight" inputmode="numeric" placeholder="e.g. 25" required id="field-weight">
            </div>

            <div class="form-group">
                <label>Mission Destination</label>
                <select name="mission" required id="field-mission">
                    <option value="Brazil South">Brazil South</option>
                    <option value="Japan Tokyo">Japan Tokyo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your Email</label>
                <input type="email" name="customer_email" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="btn-primary">Generate & Submit</button>
        </form>
    </main>

    <footer id="socials-footer">
        <p>Follow us for updates</p>
        <div style="margin-top: 10px; font-size: 1.2rem;">
            <a href="#">Instagram</a> &nbsp;&bull;&nbsp; <a href="#">Facebook</a>
        </div>
    </footer>

    <script src="/assets/js/main.js"></script>
    <script>
        let itemCount = 1;
        function addItemField() {
            itemCount++;
            const container = document.getElementById('items-container');
            const div = document.createElement('div');
            div.className = 'form-group item-row';
            div.style.marginTop = '1rem';
            div.innerHTML = `
                <label>Item ${itemCount} Photo</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="file" name="item_photo_${itemCount}" accept="image/*" style="flex: 1;">
                    <button type="button" onclick="this.closest('.item-row').remove()" style="background: #ff4d4d; width: auto; padding: 0 1rem;">X</button>
                </div>
            `;
            container.appendChild(div);
        }

        const form = document.getElementById('shop-form');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.textContent = "Processing...";
            submitBtn.disabled = true;

            // --- NEW LOGIC STARTS HERE ---

            // 1. Generate UUID (Short 8-char version is usually enough for packing slips, but here is full)
            const uuid = crypto.randomUUID(); // e.g. "A1B2C3D4"

            // 2. Set the Hidden Field (So it goes to Email)
            document.getElementById('order_uuid').value = uuid;

            // 3. Construct the Success URL with Params
            // Note: window.location.origin handles localhost vs production automatically
            const weightVal = document.getElementById('field-weight').value;
            const destVal = document.getElementById('field-mission').value;

            // Encode components to ensure URL is valid
            const successUrl = `${window.location.origin}/shop/success?id=${uuid}&weight=${weightVal}&dest=${encodeURIComponent(destVal)}`;

            document.getElementById('next_redirect').value = successUrl;

            // --- EXISTING FILE RENAMING LOGIC ---

            const formData = new FormData(form);
            const uniqueId = Date.now();

            // Rename files logic (Keep this from previous step)
            Array.from(formData.keys()).forEach((key) => {
                const file = formData.get(key);
                if (file instanceof File && file.name) {
                    const extension = file.name.split('.').pop() || 'jpg';
                    const newName = `${key}_${uniqueId}.${extension}`;
                    const renamedFile = new File([file], newName, { type: file.type });
                    formData.set(key, renamedFile);
                }
            });

            // 4. Send to FormSubmit
            fetch("https://formsubmit.co/pouchday-dev@proton.me", {
                method: "POST",
                body: formData
            })
                .then(response => {
                    // FormSubmit might redirect automatically if _next is set, 
                    // but since we are using fetch, we usually need to handle the redirect manually.
                    // However, setting _next in FormData tells FormSubmit where to go IF we were using a standard submit.
                    // With fetch, we just redirect manually:

                    window.location.href = successUrl;
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Upload failed.");
                    submitBtn.textContent = "Try Again";
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>

</html>
